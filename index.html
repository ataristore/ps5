<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سنتر اتاري | Atari Center</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }
        .hero {
            height: 60vh;
            background: url('https://raw.githubusercontent.com/ataristore/ps5/main/background.jpg') no-repeat center center/contain;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 20px;
        }
        .btn-container {
            padding: 50px;
        }
        .btn {
            padding: 20px 60px;
            font-size: 24px;
            background: #ff3e3e;
            border: none;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 62, 62, 0.5);
        }
        .btn:hover {
            background: #ff1a1a;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="hero">
        <!-- الصورة المرفقة ستظهر هنا -->
    </div>

    <div class="btn-container">
        <h1>قائمة التهكير والاستغلال</h1>
        <!-- اضف اسم ملف الـ payload الخاص بك هنا -->
        <button class="btn" onclick="runPayload('payload.js')">RUN EXPLOIT</button>
    </div>

    <script>
        function runPayload(payloadName) {
            alert('جاري تشغيل: ' + payloadName);
            // هذا الجزء سيقوم بتنفيذ ملف الـ JS الخاص بالتهكير
            var script = document.createElement('script');
            script.src = payloadName;
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
